name: CI/CD - Azure Container Apps

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  id-token: write
  contents: read

