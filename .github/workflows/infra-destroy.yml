name: "Terraform Destroy"

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for Azure OIDC authentication
  contents: read # Required to check out repository code

jobs:
  destroy-plan:
    name: "Terraform Destroy Plan"
    environment: sandbox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select sandbox

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -out=tfdestroyplan

      - name: Upload Destroy Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfdestroyplan
          path: terraform/tfdestroyplan

  destroy-apply:
    name: "Terraform Destroy Apply"
    needs: destroy-plan
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Download Destroy Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfdestroyplan
          path: terraform

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select sandbox

      - name: Terraform Destroy Apply
        run: terraform apply -auto-approve tfdestroyplan
